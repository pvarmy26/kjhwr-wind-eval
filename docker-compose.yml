version: '3.8'

services:
  backend:
    build: ./backend
    container_name: wind_eval_backend
    ports:
      - "8000:8000"
    restart: always

  frontend:
    build: ./frontend
    container_name: wind_eval_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always